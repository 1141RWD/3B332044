<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排球少年網站 - 無效按鈕互動展示</title>
    <style>
        /* --- 基礎版面設定 (您可以忽略這部分) --- */
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h2 {
            color: #333;
            margin-bottom: 30px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }
        
        /* --- 通用按鈕樣式 (排球少年風格) --- */
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%; /* 讓按鈕寬度一致 */
            position: relative;
        }

        /* =========================================
           1. 基礎互動：灰色禁止 (Basic Disabled)
           ========================================= */
        .btn-basic {
            background-color: #e67e22; /* 烏野橘 */
            color: white;
        }
        /* 當加上 disabled 屬性時的樣子 */
        .btn-basic:disabled {
            background-color: #bdc3c7;
            color: #7f8c8d;
            cursor: not-allowed; /* 禁止符號 */
            opacity: 0.8;
        }

        /* =========================================
           2. 進階互動：搖頭拒絕 (Shake Effect)
           ========================================= */
        .btn-shake {
            background-color: #333; /* 烏野黑 */
            color: white;
            cursor: pointer; /* 這裡故意讓它看起來可以按 */
        }
        .btn-shake:hover {
            background-color: #444;
        }
        
        /* 搖動動畫定義 */
        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
            100% { transform: translateX(0); }
        }
        
        /* JS 會觸發這個 class */
        .shake-active {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            background-color: #c0392b !important; /* 錯誤時變紅色 */
        }

        /* =========================================
           3. 資訊互動：懸浮提示 (Tooltip)
           ========================================= */
        .btn-tooltip {
            background-color: #2980b9; /* 青葉城西青 */
            color: white;
            cursor: help; /* 問號游標 */
        }
        
        /* Tooltip 本體 */
        .btn-tooltip:hover::after {
            content: attr(data-msg); /* 抓取 HTML 屬性 */
            position: absolute;
            bottom: 110%; /* 出現在上方 */
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
        }
        /* Tooltip 小三角形 */
        .btn-tooltip:hover::before {
            content: "";
            position: absolute;
            bottom: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: black transparent transparent transparent;
        }

        /* =========================================
           4. 趣味互動：文字變換 (Text Swap) - 推薦！
           ========================================= */
        .btn-swap {
            background-color: #e67e22; /* 烏野橘 */
            color: white;
            overflow: hidden; /* 隱藏超出的文字 */
            height: 50px;     /* 固定高度很重要 */
            padding: 0;       /* 清除 padding 以便用 Flex 定位 */
        }
        
        .btn-swap span {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
            font-size: 18px;
        }

        .text-original {
            transform: translateY(0);
        }
        
        .text-hover {
            transform: translateY(100%); /* 藏在下面 */
            background-color: #333;      /* 變換後的背景色 */
            color: #e67e22;              /* 變換後的文字色 */
        }

        /* 滑鼠滑過時的動作 */
        .btn-swap:hover .text-original {
            transform: translateY(-100%); /* 往上飛走 */
        }
        .btn-swap:hover .text-hover {
            transform: translateY(0); /* 從下面補位 */
        }

    </style>
</head>
<body>

    <h2>排球少年網站 - 按鈕互動展示</h2>

    <div class="container">
        
        <div>
            <p style="font-size:12px; color:#666;">1. 基礎禁止 (Cursor Disabled)</p>
            <button class="btn btn-basic" disabled>
                加入排球部 (名額已滿)
            </button>
        </div>

        <div>
            <p style="font-size:12px; color:#666;">2. 點擊會搖頭 (Shake on Click)</p>
            <button class="btn btn-shake" onclick="triggerShake(this)">
                申請友誼賽
            </button>
        </div>

        <div>
            <p style="font-size:12px; color:#666;">3. 滑鼠懸浮提示 (Tooltip)</p>
            <button class="btn btn-tooltip" data-msg="教練說等級不夠不能解鎖">
                解鎖必殺技
            </button>
        </div>

        <div>
            <p style="font-size:12px; color:#666;">4. 滑鼠懸浮變字 (Text Swap)</p>
            <button class="btn btn-swap">
                <span class="text-original">飛吧 (Fly High)</span>
                <span class="text-hover">被攔網了... 🚫</span>
            </button>
        </div>

    </div>

    <script>
        // 用於控制第 2 個按鈕 (搖頭效果) 的 JavaScript
        function triggerShake(element) {
            // 避免使用者狂按導致動畫卡住，先檢查是否正在動畫中
            if (element.classList.contains('shake-active')) return;

            // 加入動畫 class
            element.classList.add('shake-active');
            
            // 為了增加趣味，稍微改變文字一下
            const originalText = element.innerText;
            element.innerText = "目前無法申請！";

            // 動畫時間結束後 (0.4秒)，移除 class 並恢復文字
            setTimeout(() => {
                element.classList.remove('shake-active');
                element.innerText = originalText;
            }, 400);
        }
    </script>

</body>
</html>
